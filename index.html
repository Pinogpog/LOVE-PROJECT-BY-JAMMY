<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAMMYY</title>
    <link rel="stylesheet" href="./public/css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="hearts-bg"></div>
    <div class="container">
      <div class="banner-gif">
        <img id="banner" src="./public/images/mid.gif" alt="banner" />
      </div>
      <h1 id="question-heading">✨ Do you accept my flowers? ✨</h1>
      <div class="buttons">
        <button id="yes-button" class="romantic-btn yes-btn"><p>💕 Yes 💕</p></button>
        <button id="no-button" class="romantic-btn no-btn"><p>Not Sure Yet</p></button>
      </div>
      <div class="message">
        <h2 id="success-message">You just made me the happiest! 💕✨</h2>
        
        <h6>Creator: <a class="creator" href="https://github.com/Pinogpog">DEVJAMMYY ;)</a></h6>
      </div>
      <div class="language-selector">
        <label for="language-select">Choose Language:</label>
        <select id="language-select" onchange="changeLanguage()">
          <option value="english">English</option>
          <option value="french">French</option>
          <option value="thai">แบบไทย</option>
        </select>
      </div>
    </div>
    <script src="./public/js/script.js"></script>
  </body>
</html>
